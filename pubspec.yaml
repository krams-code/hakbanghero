name: hakbanghero
description: "A gamified fitness tracker for running, walking and jogging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0

  # UI & Animation
  intl: ^0.20.2
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.10        # Layered SVG character avatar rendering

  # Local Storage
  shared_preferences: ^2.3.5

  # ── GPS / Location (NEW) ──────────────────────────────────────────────────
  wakelock_plus: ^1.2.8         # keep the screen on during a run
  geolocator: ^13.0.4          # GPS speed + position stream

  # ── Real maps (OpenStreetMap streets, MapTiler satellite) ────────────────
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # ── Sudden mid-run challenge alarm ────────────────────────────────────────
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
  assets:
    - assets/images/
    - assets/images/badges/
    - assets/images/backgrounds/
    - assets/images/character/
    - assets/images/character/female/
    - assets/images/character/female/clothes/
    - assets/images/character/hair/
    - assets/images/character/face/
    - assets/images/character/clothes/
    - assets/images/guide/
    - assets/fonts/
    - assets/animations/
    - assets/animations/lottie/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/images/icons/
    - assets/images/icons/items/
    - assets/images/warmup/
    - assets/images/maps/
    - assets/images/heroes/sprout/underweight/
    - assets/images/heroes/sprout/normal/
    - assets/images/heroes/sprout/overweight/
    - assets/images/heroes/sprout/obese/
    - assets/images/heroes/sprout_girl/underweight/
    - assets/images/heroes/sprout_girl/normal/
    - assets/images/heroes/sprout_girl/overweight/
    - assets/images/heroes/sprout_girl/obese/
    - assets/images/heroes/frog/
    - assets/images/heroes/penguin/
    - assets/images/heroes/slime/
    - assets/images/heroes/bear/
    - assets/images/heroes/cat/
